name: PocketBook Era English package
on:
  push:
    branches: ['master', 'codex/pocketbook-era-speaker']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit qemu-user
      - name: Check Lua syntax
        run: luajit -e 'for f in io.popen("find . -maxdepth 1 -name \"*.lua\""):lines() do assert(loadfile(f), f) end'
      - name: Test PocketBook routing and playback
        run: sh dev/run_pocketbook_tests.sh
      - name: Assemble installable English package
        run: python3 tools/package-era.py
      - name: Verify bundled ARM English speech and WAV playback
        run: python3 dev/smoke-era-runtime.py dist/audiobook-era-v0.6.3.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: audiobook-era-v0.6.3.1
          path: dist/*
